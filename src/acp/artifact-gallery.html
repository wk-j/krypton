<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artifact gallery</title>
<style>
  :root {
    --bg: #17191d; --fg: #eaecef; --muted: #707a8a; --border: #2f353d;
    --accent: #fcd535; --card: #21242a; --code-bg: #1d1f24;
    --add: #0ecb81; --del: #f6465d; color-scheme: dark;
    --sans: 'BinanceNova', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'BinancePlex', 'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace;
  }
  body { margin: 0; font-family: var(--sans); font-size: 14px; line-height: 1.5;
         background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  .main { max-width: 1140px; margin: 0 auto; padding: 16px 20px 48px; }
  h2, h3 { letter-spacing: .04em; }
  h2 { font-size: 14px; margin: 0; }
  h3 { font-size: 11px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .top { display: flex; justify-content: space-between; align-items: center;
         gap: 16px; flex-wrap: wrap; padding: 14px 16px; margin: 6px 0 14px;
         background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.live { background: var(--add); animation: beacon 2s infinite; }
  @keyframes beacon { 0% { box-shadow: 0 0 0 0 rgba(14,203,129,.55); }
                      70% { box-shadow: 0 0 0 10px rgba(14,203,129,0); }
                      100% { box-shadow: 0 0 0 0 rgba(14,203,129,0); } }
  .title { font-size: 15px; font-weight: 700; }
  .sub, .state, .footer { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .stats { display: flex; gap: 22px; flex-wrap: wrap; }
  .stat { text-align: right; }
  .stat b { display: block; font-family: var(--mono); font-size: 19px; color: var(--accent);
            font-variant-numeric: tabular-nums; }
  .stat span { font-size: 10px; color: var(--muted); }
  .state { padding: 10px 12px; margin-bottom: 14px; background: rgba(252,213,53,.06);
           border: 1px solid var(--border); border-radius: 8px; color: var(--accent); }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
          position: sticky; top: 0; z-index: 2; background: var(--bg);
          padding: 6px 0 8px; border-bottom: 1px solid var(--border); }
  .tab { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; cursor: pointer;
         color: var(--muted); background: transparent; border: 1px solid transparent;
         border-radius: 6px; padding: 5px 10px; }
  .tab:hover { color: var(--fg); background: var(--code-bg); }
  .tab.active { color: var(--accent); background: rgba(252,213,53,.07); border-color: var(--accent); }
  .tab b { font-weight: 400; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .tab.active b { color: var(--accent); }
  .tab-key { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-left: auto; }
  .project { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .project:first-child { margin-top: 0; padding-top: 14px; border-top: 0; }
  .project-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .project-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); font-family: var(--mono); font-size: 12px;
           padding: 64px 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 12px; }
  .art { display: flex; flex-direction: column; gap: 8px;
         background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 13px; }
  .art-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .art-title { font-weight: 700; font-size: 13px; line-height: 1.35; overflow: hidden;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .art-lane { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .pill { font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
          padding: 2px 7px; border-radius: 20px; border: 1px solid currentColor; white-space: nowrap; }
  .pill::before { content: "\25CF"; margin-right: 4px; font-size: 8px; vertical-align: middle; }
  .st-live { color: var(--add); }
  .st-pending { color: var(--accent); }
  .art-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .art-size { font-family: var(--mono); font-size: 12px; color: var(--fg);
              font-variant-numeric: tabular-nums; }
  .art-tail { font-family: var(--mono); font-size: 10px; color: var(--muted);
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .art-open { display: inline-block; align-self: flex-start; margin-top: 2px;
              font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-decoration: none;
              color: var(--bg); background: var(--accent); border-radius: 6px; padding: 4px 12px; }
  .art-open.disabled { color: var(--muted); background: var(--code-bg);
                       border: 1px solid var(--border); pointer-events: none; }
  .footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--border); }
  @media (max-width: 780px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="main">
  <div class="top">
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div>
        <div class="title">Artifact gallery</div>
        <div class="sub" id="session">connecting...</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="total-count">0</b><span>artifacts</span></div>
      <div class="stat"><b id="live-count">0</b><span>live</span></div>
      <div class="stat"><b id="pending-count">0</b><span>pending</span></div>
    </div>
  </div>
  <div class="state" id="state">connecting...</div>
  <nav class="tabs" id="tabs" hidden></nav>
  <div id="projects"></div>
  <div class="footer">read-only gallery &middot; polls /artifacts &middot; [ ] switch project &middot; 1-9 jump &middot; 0 all projects &middot; open links serve the registered artifact on this origin</div>
</main>

<script>
(function () {
  "use strict";

  var POLL_MS = 1000;
  var projects = [];
  var projectLabels = new Map();
  var lastSignature = "";
  var hasSuccessfulPoll = false;
  var pollInFlight = false;
  // "" = the All tab. Kept across polls so a 1 s refresh never yanks the
  // reader back to another project; falls back to All if the project disappears.
  var activeProject = "";

  function R(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function formatSize(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }
  function stateKey(state) { return state === "live" ? "live" : "pending"; }

  function renderArtifact(art) {
    var sk = stateKey(art.state);
    var size = sk === "live" ? formatSize(art.size) : "writing...";
    var hashPrefix = art.hash ? esc(String(art.hash).slice(0, 12)) + " &middot; " : "";
    var open = sk === "live" && art.token
      ? '<a class="art-open" href="/artifact/' + encodeURIComponent(art.token) + '" target="_blank" rel="noopener">Open</a>'
      : '<span class="art-open disabled">pending</span>';
    return '<div class="art">' +
      '<div class="art-head"><div class="art-title">' + esc(art.title || "untitled") + '</div>' +
      '<span class="pill st-' + sk + '">' + esc(sk) + '</span></div>' +
      '<div class="art-lane">' + esc(art.laneLabel || "?") + '</div>' +
      '<div class="art-meta"><span class="art-size">' + size + '</span></div>' +
      '<div class="art-tail">' + hashPrefix + esc(art.tail || "") + '</div>' +
      open +
      '</div>';
  }

  function renderProject(project, showHead) {
    var arts = Array.isArray(project.artifacts) ? project.artifacts : [];
    var label = projectLabels.get(project.projectId) || project.projectName || "project";
    var cards = arts.map(renderArtifact).join("");
    var head = showHead
      ? '<div class="project-head"><div><h2>' + esc(label) + '</h2></div>' +
        '<div class="project-meta">' + arts.length + (arts.length === 1 ? " artifact" : " artifacts") + '</div></div>'
      : '';
    return '<section class="project">' + head + '<div class="cards">' + cards + '</div></section>';
  }

  function buildProjectLabels(next) {
    var counts = new Map();
    next.forEach(function (project) {
      var name = project.projectName || "project";
      counts.set(name, (counts.get(name) || 0) + 1);
    });
    var labels = new Map();
    next.forEach(function (project) {
      var name = project.projectName || "project";
      var suffix = String(project.projectId || "").replace(/^project-/, "").slice(-6);
      labels.set(project.projectId, counts.get(name) > 1 ? name + " · " + suffix : name);
    });
    return labels;
  }

  function visibleProjects() {
    if (!activeProject) return projects;
    return projects.filter(function (project) { return project.projectId === activeProject; });
  }

  function renderTabs(total) {
    var el = R("tabs");
    el.hidden = projects.length === 0;
    if (projects.length === 0) { el.innerHTML = ""; return; }
    var buttons = ['<button type="button" class="tab' + (activeProject ? '' : ' active') +
      '" data-project="">all<b>' + total + '</b></button>'];
    projects.forEach(function (project, index) {
      var key = index < 9 ? ' title="' + (index + 1) + '"' : '';
      var id = project.projectId || "";
      var label = projectLabels.get(id) || project.projectName || "project";
      var count = Array.isArray(project.artifacts) ? project.artifacts.length : 0;
      buttons.push('<button type="button" class="tab' + (activeProject === id ? ' active' : '') +
        '" data-project="' + esc(id) + '"' + key + '>' + esc(label) + '<b>' + count + '</b></button>');
    });
    buttons.push('<span class="tab-key">[ ] switch &middot; 1-9 jump &middot; 0 all</span>');
    el.innerHTML = buttons.join("");
  }

  function renderContent() {
    var visible = visibleProjects();
    if (visible.length === 0) {
      R("projects").innerHTML = '<div class="empty">No artifacts for this project.</div>';
      return;
    }
    var showHead = !activeProject;
    R("projects").innerHTML = visible.map(function (project) {
      return renderProject(project, showHead);
    }).join("");
  }

  function apply(next) {
    projects = next;
    projectLabels = buildProjectLabels(next);
    var total = 0, live = 0, pending = 0;
    next.forEach(function (project) {
      (project.artifacts || []).forEach(function (art) {
        total++;
        if (stateKey(art.state) === "live") live++; else pending++;
      });
    });
    R("total-count").textContent = String(total);
    R("live-count").textContent = String(live);
    R("pending-count").textContent = String(pending);
    R("dot").classList.toggle("live", total > 0);
    R("session").textContent = total > 0 ? "live" : "no artifacts yet";
    if (total === 0) {
      activeProject = "";
      renderTabs(0);
      R("projects").innerHTML =
        '<div class="empty">No artifacts yet — lanes will surface HTML artifacts here as they register them.</div>';
      R("state").textContent = "no artifacts yet";
      return;
    }
    if (activeProject && !projects.some(function (project) {
      return project.projectId === activeProject;
    })) activeProject = "";
    renderTabs(total);
    renderContent();
    R("state").textContent = activeProject
      ? "live gallery · " + (projectLabels.get(activeProject) || "project")
      : "live gallery";
  }

  function selectProject(projectId) {
    if (activeProject === projectId) return;
    activeProject = projectId;
    apply(projects);
    window.scrollTo({ top: 0 });
  }

  R("tabs").addEventListener("click", function (event) {
    var button = event.target.closest(".tab");
    if (button) selectProject(button.getAttribute("data-project") || "");
  });
  document.addEventListener("keydown", function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (projects.length === 0) return;
    var projectIds = [""].concat(projects.map(function (project) { return project.projectId; }));
    if (event.key === "[" || event.key === "]") {
      event.preventDefault();
      var index = Math.max(0, projectIds.indexOf(activeProject));
      selectProject(projectIds[(index + (event.key === "]" ? 1 : -1) + projectIds.length) % projectIds.length]);
      return;
    }
    if (event.key === "0") { event.preventDefault(); selectProject(""); return; }
    if (/^[1-9]$/.test(event.key)) {
      var target = projects[Number(event.key) - 1];
      if (target) { event.preventDefault(); selectProject(target.projectId); }
    }
  });

  function poll() {
    if (pollInFlight) return;
    pollInFlight = true;
    fetch("/artifacts", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("http " + res.status);
      return res.json();
    }).then(function (body) {
      var next = Array.isArray(body && body.projects) ? body.projects : [];
      hasSuccessfulPoll = true;
      var sig = JSON.stringify(next.map(function (project) {
        return [project.projectId, project.projectName, (project.artifacts || []).map(function (a) {
          return [a.id, a.state, a.size, a.hash, a.token, a.title, a.laneLabel, a.tail];
        })];
      }));
      if (sig !== lastSignature) {
        lastSignature = sig;
        apply(next);
      }
    }).catch(function () {
      R("state").textContent = projects.length || hasSuccessfulPoll ? "reconnecting..." : "connecting...";
      R("session").textContent = projects.length || hasSuccessfulPoll ? "reconnecting..." : "connecting...";
    }).finally(function () {
      pollInFlight = false;
    });
  }

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
