<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krypton Timeline</title>
<style>
  :root {
    --bg: #17191d; --fg: #eaecef; --text: #b7bdc6; --muted: #707a8a;
    --border: #2f353d; --accent: #fcd535; --card: #21242a; --code-bg: #1d1f24;
    --add: #0ecb81; --del: #f6465d; color-scheme: dark;
    --tint: rgba(252, 213, 53, .07);
    --sans: 'BinanceNova', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'BinancePlex', 'JetBrains Mono', 'SF Mono', Menlo, ui-monospace, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa; --fg: #0d1117; --text: #474d57; --muted: #707a8a;
      --border: #eaecef; --accent: #c99400; --card: #fff; --code-bg: #f5f5f5;
      --add: #018f6c; --del: #cf304a; color-scheme: light;
      --tint: rgba(201, 148, 0, .08);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); }
  header {
    height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 18px;
    border-bottom: 1px solid var(--border); background: var(--card); position: sticky; top: 0; z-index: 3;
  }
  .brand { color: var(--fg); font-weight: 700; }
  .local { color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 2px 7px; font: 10px var(--mono); }
  .search { margin-left: auto; width: min(320px, 42vw); }
  input {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--code-bg);
    color: var(--fg); padding: 6px 9px; font: 12px var(--mono); outline: none;
  }
  input:focus { border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: minmax(200px, 250px) minmax(0, 1fr); max-width: 1180px; min-height: calc(100vh - 48px); margin: 0 auto; }
  aside { border-right: 1px solid var(--border); padding: 14px 10px; }
  .aside-title { color: var(--muted); font: 10px var(--mono); padding: 0 8px; }
  .topic-list { display: grid; gap: 1px; margin-top: 8px; }
  .topic {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline;
    width: 100%; text-align: left; border: 0; border-radius: 5px;
    color: var(--text); background: transparent; padding: 5px 8px; cursor: pointer; font: inherit;
  }
  .topic:hover { color: var(--fg); background: var(--code-bg); }
  .topic.active { color: var(--accent); background: var(--tint); }
  .topic strong { font-size: 12.5px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .topic span { color: var(--muted); font: 10px var(--mono); }
  main { min-width: 0; padding: 18px 24px 48px; }
  .summary { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; margin-bottom: 4px; }
  h1 { margin: 0; color: var(--fg); font-size: 19px; min-width: 0; overflow-wrap: anywhere; }
  .count { color: var(--muted); font: 10px var(--mono); white-space: nowrap; }
  .events { border-top: 1px solid var(--border); margin-top: 10px; }
  .day {
    position: sticky; top: 48px; z-index: 1; background: var(--bg);
    padding: 8px 0 5px; color: var(--muted); font: 10px var(--mono);
    border-bottom: 1px solid var(--border);
  }
  .event { border-bottom: 1px solid var(--border); padding: 7px 8px; cursor: pointer; outline: none; }
  .event:hover { background: var(--code-bg); }
  .event.selected { background: var(--tint); }
  .event.superseded .event-summary { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--border); }
  .event-head { display: grid; grid-template-columns: 42px minmax(0, 1fr) minmax(0, auto); gap: 12px; align-items: baseline; }
  .event-time, .pill, dt, .source, .relation, .label, .detail-toggle { font-family: var(--mono); }
  .event-time { color: var(--muted); font-size: 11px; }
  .event-summary { color: var(--fg); font-size: 13.5px; min-width: 0; overflow-wrap: anywhere; }
  .event.selected .event-summary { color: var(--accent); }
  .event-meta { display: flex; gap: 8px; align-items: baseline; color: var(--muted); font: 10px var(--mono); }
  .event-meta .who { max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; color: var(--muted); font-size: 9px; white-space: nowrap; max-width: 20ch; overflow: hidden; text-overflow: ellipsis; }
  .pill.state { color: var(--accent); border-color: var(--accent); }
  .detail-toggle {
    border: 0; padding: 1px 0; color: var(--muted); background: transparent;
    font-size: 9px; cursor: pointer; white-space: nowrap;
  }
  .detail-toggle:hover, .detail-toggle:focus-visible { color: var(--accent); outline: none; }
  .detail-toggle::before { content: '▸ '; }
  .detail-toggle[aria-expanded="true"]::before { content: '▾ '; }
  .detail { margin: 8px 0 4px 54px; display: grid; gap: 7px; color: var(--text); }
  .detail--audit { padding-top: 8px; border-top: 1px solid var(--border); }
  dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; }
  dt { color: var(--muted); font-size: 10px; }
  dd { margin: 0; color: var(--text); font-size: 12.5px; }
  .copy { white-space: pre-wrap; font-size: 13px; }
  .label { color: var(--muted); font-size: 10px; }
  .relation { color: var(--muted); font-size: 11px; }
  .source { color: var(--accent); font-size: 11px; word-break: break-all; }
  .source-ref { color: var(--muted); font: 10px var(--mono); word-break: break-all; }
  .diagnostics { margin-top: 20px; padding: 10px 12px; border: 1px solid var(--del); border-radius: 8px; background: rgba(246, 70, 93, .05); }
  .diagnostics h2 { margin: 0 0 6px; color: var(--del); font-size: 13px; }
  .diagnostics li { margin: 3px 0; font: 11px var(--mono); }
  .empty { padding: 36px 0; text-align: center; color: var(--muted); font: 12px var(--mono); }
  footer { margin-top: 18px; color: var(--muted); font: 10px var(--mono); }
  @media (max-width: 980px) { .event-meta .who { display: none; } }
  @media (max-width: 760px) { .event-meta .pill.topic { display: none; } }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    main { padding: 14px 14px 32px; }
    .summary { grid-template-columns: 1fr; }
    .detail { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">Krypton Timeline</span>
  <span class="local">เฉพาะเครื่องนี้</span>
  <label class="search"><input id="search" type="search" placeholder="ค้นหาสรุป ผู้เกี่ยวข้อง และแหล่งอ้างอิง · /" autocomplete="off"></label>
</header>
<div class="layout">
  <aside>
    <div class="aside-title">หัวข้อ · [ ] เปลี่ยน</div>
    <div id="topics" class="topic-list"></div>
  </aside>
  <main>
    <div class="summary"><h1 id="title">ลำดับเหตุการณ์</h1><span id="count" class="count"></span></div>
    <div id="events" class="events"></div>
    <section id="diagnostics" class="diagnostics" hidden><h2>ข้อมูลผิดพลาด</h2><ul></ul></section>
    <footer>j/k เลื่อน · Space รายละเอียด · i ข้อมูลการบันทึก · Enter เปิดแหล่งอ้างอิง · r สลับลำดับ · / ค้นหา · [ ] เปลี่ยนหัวข้อ · Esc ล้างตัวกรอง · refresh เพื่ออ่านจาก disk ใหม่</footer>
  </main>
</div>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var harness = params.get('harness') || '';
  var initialQuery = params.get('topic') || '';
  var search = document.getElementById('search');
  var topicsEl = document.getElementById('topics');
  var eventsEl = document.getElementById('events');
  var titleEl = document.getElementById('title');
  var countEl = document.getElementById('count');
  var diagnosticsEl = document.getElementById('diagnostics');
  var payload = { events: [], diagnostics: [] };
  var selectedTopic = '';
  var selectedEvent = 0;
  var newestFirst = false;
  var detailMode = '';
  // Rows of the last render, index-aligned with visibleEvents(). Detail DOM is
  // opt-in and exists on the selected row only.
  var rows = [];

  function lower(value) { return String(value || '').toLocaleLowerCase('th-TH'); }
  function relationLabel(value) {
    return {
      supersedes: 'แทนที่',
      refines: 'ปรับรายละเอียดของ',
      implements: 'นำไปใช้จาก',
      supports: 'สนับสนุน',
      caused_by: 'เกิดจาก'
    }[value] || value;
  }
  function latestTopics(events) {
    var map = new Map();
    events.forEach(function (event) {
      var prior = map.get(event.topicId);
      if (!prior || event.occurredAt >= prior.occurredAt) {
        map.set(event.topicId, { id: event.topicId, title: event.topicTitle, occurredAt: event.occurredAt, count: 0 });
      }
    });
    events.forEach(function (event) { var topic = map.get(event.topicId); if (topic) topic.count += 1; });
    return Array.from(map.values()).sort(function (a, b) { return b.occurredAt.localeCompare(a.occurredAt); });
  }
  function eventMatches(event, query) {
    if (!query) return true;
    return lower([event.topicTitle, event.summary, event.madeBy, event.recordedBy, event.evidenceExcerpt || '', event.instructionExcerpt || '', event.rationale || '', event.impact || '', event.sourceRef || ''].join(' ')).includes(query);
  }
  function sourceHref(source) {
    if (!source) return '';
    if (/^https?:\/\//i.test(source)) return source;
    if (/\.md(?:#.*)?$/i.test(source) && !source.startsWith('/')) {
      var parts = source.split('#');
      return '/doc?harness=' + encodeURIComponent(harness) + '&path=' + encodeURIComponent(parts[0]) + (parts[1] ? '#' + encodeURIComponent(parts[1]) : '');
    }
    return '';
  }
  function addText(parent, tag, className, text) {
    var element = document.createElement(tag);
    if (className) element.className = className;
    element.textContent = text;
    parent.appendChild(element);
    return element;
  }
  function addCopy(parent, label, text) {
    var block = addText(parent, 'div', 'copy', '');
    addText(block, 'span', 'label', label + ' · ');
    block.append(document.createTextNode(text));
  }
  function isGenericActor(value) {
    var actor = lower(value).trim();
    return actor === 'current user' || actor === 'local user';
  }
  function hasContext(event) {
    return Boolean(event.rationale || event.impact || (event.relation && event.relatedEvent) || event.sourceRef);
  }
  function renderTopics(topics, query) {
    topicsEl.replaceChildren();
    var visible = topics.filter(function (topic) { return !query || lower(topic.title).includes(query); });
    var all = document.createElement('button');
    all.type = 'button'; all.className = 'topic' + (selectedTopic ? '' : ' active');
    addText(all, 'strong', '', 'ทุกรายการ'); addText(all, 'span', '', String(payload.events.length));
    all.addEventListener('click', function () { selectedTopic = ''; selectedEvent = 0; render(); });
    topicsEl.appendChild(all);
    visible.forEach(function (topic) {
      var button = document.createElement('button');
      button.type = 'button'; button.className = 'topic' + (selectedTopic === topic.id ? ' active' : '');
      button.title = topic.title + ' · ' + topic.occurredAt.slice(0, 10);
      addText(button, 'strong', '', topic.title); addText(button, 'span', '', String(topic.count));
      button.addEventListener('click', function () { selectedTopic = topic.id; selectedEvent = 0; render(); });
      topicsEl.appendChild(button);
    });
  }
  /** Collapsed row: time, full wrapping summary, who decided, state pills. */
  function renderRow(event, index) {
    var card = document.createElement('article');
    card.className = 'event' + (event.superseded ? ' superseded' : '');
    card.tabIndex = 0; card.dataset.eventIndex = String(index);
    var head = document.createElement('div'); head.className = 'event-head'; card.appendChild(head);
    var occurred = new Date(event.occurredAt);
    addText(head, 'span', 'event-time', isNaN(occurred) ? event.occurredAt.slice(11, 16) : occurred.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }));
    var summary = addText(head, 'span', 'event-summary', event.summary);
    summary.title = event.summary;
    var meta = document.createElement('div'); meta.className = 'event-meta'; head.appendChild(meta);
    if (!isGenericActor(event.madeBy)) addText(meta, 'span', 'who', event.madeBy);
    if (!selectedTopic) addText(meta, 'span', 'pill topic', event.topicTitle);
    if (event.superseded) addText(meta, 'span', 'pill state', 'แทนที่แล้ว');
    if (event.sourceRef) addText(meta, 'span', 'pill', 'อ้างอิง');
    var toggle = addText(meta, 'button', 'detail-toggle', hasContext(event) ? 'รายละเอียด' : 'ข้อมูลบันทึก');
    toggle.type = 'button';
    toggle.dataset.detailMode = hasContext(event) ? 'context' : 'audit';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-controls', 'timeline-detail-' + event.id);
    card.setAttribute('aria-label', event.summary);
    return card;
  }
  /** Opt-in context/audit body for the selected row only. */
  function renderDetail(event, mode) {
    var detail = document.createElement('div');
    detail.className = 'detail detail--' + mode;
    detail.id = 'timeline-detail-' + event.id;
    if (event.rationale) addCopy(detail, 'เหตุผล', event.rationale);
    if (event.impact) addCopy(detail, 'ผลกระทบ', event.impact);
    if (event.relation && event.relatedEvent) addText(detail, 'div', 'relation', relationLabel(event.relation) + 'เหตุการณ์ก่อนหน้า');
    if (event.sourceRef) {
      var href = sourceHref(event.sourceRef);
      if (href) {
        var link = addText(detail, 'a', 'source', 'เปิดแหล่งอ้างอิง ↗');
        link.href = href; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.title = event.sourceRef;
      }
    }
    if (mode === 'audit') {
      var details = document.createElement('dl'); detail.appendChild(details);
      [
        ['บันทึกโดย', event.recordedBy + ' · ' + event.recorderLane],
        ['หัวข้อ', event.topicTitle + ' · ' + event.topicId],
        ['เหตุการณ์', event.id]
      ].forEach(function (row) {
        addText(details, 'dt', '', row[0]); addText(details, 'dd', '', row[1]);
      });
      if (event.suggestedByLane) { addText(details, 'dt', '', 'เสนอโดย'); addText(details, 'dd', '', event.suggestedByLane); }
      if (event.relatedEvent) { addText(details, 'dt', '', 'เหตุการณ์ที่เกี่ยวข้อง'); addText(details, 'dd', '', event.relatedEvent); }
      if (event.evidenceExcerpt) addCopy(detail, 'หลักฐาน', event.evidenceExcerpt);
      if (event.instructionExcerpt) addCopy(detail, 'คำสั่งที่อนุญาตให้บันทึก', event.instructionExcerpt);
      if (event.sourceRef) addText(detail, 'div', 'source-ref', event.sourceRef);
    }
    return detail;
  }
  function visibleEvents() {
    var query = lower(search.value.trim());
    var events = payload.events.filter(function (event) {
      return (!selectedTopic || event.topicId === selectedTopic) && eventMatches(event, query);
    });
    return newestFirst ? events.slice().reverse() : events;
  }
  function updateRow(index, selected, event) {
    var row = rows[index];
    if (!row) return;
    row.classList.toggle('selected', selected);
    var toggle = row.querySelector('.detail-toggle');
    if (toggle) toggle.setAttribute('aria-expanded', String(selected && Boolean(detailMode)));
    var detail = row.querySelector('.detail');
    if (detail) detail.remove();
    if (selected && detailMode) row.appendChild(renderDetail(event, detailMode));
  }
  /** Move selection without opening provenance or rebuilding the list. */
  function select(index, scroll) {
    var events = visibleEvents();
    if (events.length === 0) return;
    var previous = selectedEvent;
    var next = Math.max(0, Math.min(events.length - 1, index));
    if (previous !== next) {
      updateRow(previous, false, events[previous]);
      selectedEvent = next;
      detailMode = '';
    }
    updateRow(selectedEvent, true, events[selectedEvent]);
    var card = rows[selectedEvent];
    if (card && scroll) { card.focus({ preventScroll: true }); card.scrollIntoView({ block: 'nearest' }); }
  }
  function toggleDetail(mode) {
    var events = visibleEvents();
    if (!events[selectedEvent]) return;
    detailMode = detailMode === mode ? '' : mode;
    updateRow(selectedEvent, true, events[selectedEvent]);
  }
  function dayLabel(value) {
    var date = new Date(value);
    if (isNaN(date)) return value.slice(0, 10);
    return date.toLocaleDateString('th-TH', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' });
  }
  function renderDiagnostics() {
    diagnosticsEl.hidden = payload.diagnostics.length === 0;
    var list = diagnosticsEl.querySelector('ul'); list.replaceChildren();
    payload.diagnostics.forEach(function (item) { addText(list, 'li', '', item.path + ' · ' + item.error); });
  }
  function render() {
    detailMode = '';
    var topics = latestTopics(payload.events);
    var query = lower(search.value.trim());
    renderTopics(topics, query);
    var events = visibleEvents();
    if (selectedEvent >= events.length) selectedEvent = Math.max(0, events.length - 1);
    eventsEl.replaceChildren();
    rows = [];
    if (events.length === 0) addText(eventsEl, 'div', 'empty', 'ไม่พบเหตุการณ์ที่ตรงกับตัวกรอง');
    else {
      var day = '';
      events.forEach(function (event, index) {
        var key = String(event.occurredAt).slice(0, 10);
        if (key !== day) { day = key; addText(eventsEl, 'div', 'day', dayLabel(event.occurredAt)); }
        var row = renderRow(event, index);
        rows.push(row);
        eventsEl.appendChild(row);
      });
    }
    var selected = topics.find(function (topic) { return topic.id === selectedTopic; });
    titleEl.textContent = selected ? selected.title : 'ลำดับเหตุการณ์';
    countEl.textContent = events.length + ' รายการ · ' + (newestFirst ? 'ใหม่ไปเก่า' : 'เก่าไปใหม่');
    if (events.length > 0) select(selectedEvent, false);
    renderDiagnostics();
  }
  function switchTopic(delta) {
    var ids = [''].concat(latestTopics(payload.events).map(function (topic) { return topic.id; }));
    var index = Math.max(0, ids.indexOf(selectedTopic));
    selectedTopic = ids[(index + delta + ids.length) % ids.length]; selectedEvent = 0; render();
  }
  eventsEl.addEventListener('click', function (event) {
    var target = event.target instanceof Element ? event.target : null;
    var row = target && target.closest('.event');
    if (!row) return;
    var index = Number(row.dataset.eventIndex);
    select(index, false);
    var toggle = target.closest('.detail-toggle');
    if (toggle) toggleDetail(toggle.dataset.detailMode || 'context');
  });
  eventsEl.addEventListener('focusin', function (event) {
    var target = event.target instanceof Element ? event.target : null;
    var row = target && target.closest('.event');
    if (row) select(Number(row.dataset.eventIndex), false);
  });
  search.value = initialQuery;
  search.addEventListener('input', function () { selectedEvent = 0; render(); });
  document.addEventListener('keydown', function (event) {
    if (event.key === '/' && document.activeElement !== search) { event.preventDefault(); search.focus(); search.select(); return; }
    if (event.key === 'Escape') { search.value = ''; selectedEvent = 0; search.blur(); render(); return; }
    if (document.activeElement === search) return;
    if (event.key === '[') { event.preventDefault(); switchTopic(-1); return; }
    if (event.key === ']') { event.preventDefault(); switchTopic(1); return; }
    if (event.key === 'r') { event.preventDefault(); newestFirst = !newestFirst; selectedEvent = 0; render(); return; }
    var target = event.target instanceof Element ? event.target : null;
    if (target && target.closest('button, a')) return;
    var events = visibleEvents();
    if (event.key === 'j' || event.key === 'k') {
      event.preventDefault();
      select(selectedEvent + (event.key === 'j' ? 1 : -1), true);
    }
    if (event.key === ' ' && events[selectedEvent]) {
      event.preventDefault();
      toggleDetail(hasContext(events[selectedEvent]) ? 'context' : 'audit');
    }
    if (event.key === 'i' && events[selectedEvent]) {
      event.preventDefault();
      toggleDetail('audit');
    }
    if (event.key === 'Enter' && events[selectedEvent]) {
      var href = sourceHref(events[selectedEvent].sourceRef); if (href) window.open(href, '_blank', 'noopener');
    }
  });
  if (!harness) { eventsEl.textContent = 'ไม่พบ harness id'; return; }
  fetch('/timeline.json?harness=' + encodeURIComponent(harness), { cache: 'no-store' })
    .then(function (response) { if (!response.ok) throw new Error('โหลด timeline ไม่สำเร็จ (' + response.status + ')'); return response.json(); })
    .then(function (data) {
      payload = data;
      if (initialQuery) {
        var match = latestTopics(payload.events).find(function (topic) { return lower(topic.title) === lower(initialQuery) || lower(topic.id) === lower(initialQuery); });
        if (match) { selectedTopic = match.id; search.value = ''; }
      }
      render();
    })
    .catch(function (error) { eventsEl.textContent = error.message; });
}());
</script>
</body>
</html>
