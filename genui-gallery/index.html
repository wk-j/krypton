<!doctype html>
<html lang="en" data-theme-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>GenUI component gallery</title>
  <script type="module" src="../src/acp/genui-gallery/main.ts"></script>
</head>
<body>
  <div class="gallery">
    <aside class="gallery__side">
      <header class="gallery__brand">
        <div class="gallery__eyebrow">KRYPTON / COMPONENTS</div>
        <h1 class="gallery__title">GenUI gallery</h1>
        <div class="gallery__count" id="gallery-count"></div>
        <div class="gallery__theme" id="gallery-theme"></div>
      </header>
      <div class="gallery__search-box">
        <label class="gallery__search-label" for="gallery-search">Search</label>
        <input class="gallery__search" id="gallery-search" type="search" autocomplete="off"
          placeholder="name or summary">
      </div>
      <nav class="gallery__nav" id="gallery-nav" aria-label="Components"></nav>
      <p class="gallery__empty" id="gallery-empty" hidden>No component matches.</p>
      <footer class="gallery__side-foot">/ search · [ ] prev/next · ↑↓ move · Enter open · Esc clear</footer>
    </aside>
    <main class="gallery__main" id="gallery-main">
      <article class="gallery__detail" id="gallery-detail"></article>
      <nav class="gallery__pager" id="gallery-pager" aria-label="Previous and next component"></nav>
      <footer class="gallery__foot">Fixed local examples through the production compiler and renderer. Draft and OpenUrl show demo feedback; nothing is sent to a lane.</footer>
    </main>
  </div>
</body>
</html>
