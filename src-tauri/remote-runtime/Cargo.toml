[package]
name = "krypton-remote"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "krypton-remote"
path = "src/main.rs"

[dependencies]
krypton-remote-protocol = { path = "../remote-protocol" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "process", "sync", "time", "fs"] }
